```yaml
name: Generate README Prompt

on:
  push:
    paths-ignore:
      - '.github/readme-prompt.txt'
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate-prompt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub Models extension
        run: |
          gh extension install github/gh-models

      - name: Generate README prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          files = subprocess.run(
              [
                  "find", ".",
                  "-type", "f",
                  "!",
                  "-path", "./.git/*",
                  "!",
                  "-path", "./node_modules/*",
                  "!",
                  "-path", "./.venv/*",
                  "!",
                  "-path", "./venv/*",
                  "!",
                  "-path", "./dist/*",
                  "!",
                  "-path", "./build/*",
                  "!",
                  "-path", "./.github/*",
                  "!",
                  "-name", "README.md"
              ],
              capture_output=True,
              text=True
          ).stdout.splitlines()

          repository = []

          for filename in files:
              try:
                  if os.path.getsize(filename) > 100_000:
                      continue

                  with open(filename, "r", encoding="utf-8") as f:
                      content = f.read()

                  repository.append(
                      f"\n===== {filename} =====\n{content}"
                  )

              except (UnicodeDecodeError, PermissionError, OSError):
                  pass

          repository_context = "\n".join(repository)

          prompt = f"""You are an expert software documentation analyst.

          Analyze the repository below.

          Create the contents of .github/readme-prompt.txt.

          This file will later be given to another AI which will generate
          README.md.

          The prompt should tell that AI exactly what the README should
          document based on the actual source code.

          Include relevant information such as:

          - What the project does
          - Its purpose
          - Main features
          - Installation
          - Usage
          - Commands
          - APIs and endpoints
          - Configuration
          - Environment variables
          - Dependencies
          - Examples
          - Important limitations
          - Project structure

          Only describe functionality that actually exists.

          Do not invent features.

          Do not write the README itself.

          Return ONLY the contents of .github/readme-prompt.txt.

          Repository:

          {repository_context}
          """

          result = subprocess.run(
              [
                  "gh", "models", "run",
                  "openai/gpt-4.1",
                  "--prompt", prompt
              ],
              capture_output=True,
              text=True,
              env=os.environ
          )

          if result.returncode != 0:
              print(result.stderr)
              raise SystemExit(result.returncode)

          os.makedirs(".github", exist_ok=True)

          with open(
              ".github/readme-prompt.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(result.stdout.strip() + "\n")

          print("Generated .github/readme-prompt.txt")
          PY

      - name: Commit generated prompt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/readme-prompt.txt

          if git diff --cached --quiet; then
            echo "Prompt has not changed."
            exit 0
          fi

          git commit -m "docs: update README generation prompt"
          git push
```
