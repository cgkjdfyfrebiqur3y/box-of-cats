```yaml
name: Generate README Prompt

on:
  push:
    paths-ignore:
      - ".github/readme-prompt.txt"
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  generate-prompt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub Models CLI
        run: |
          gh extension install github/gh-models

      - name: Generate README prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          import subprocess

          excluded = {
              ".git",
              "node_modules",
              ".venv",
              "venv",
              "dist",
              "build",
              ".github",
          }

          source_files = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if d not in excluded
              ]

              for filename in files:
                  path = os.path.join(root, filename)

                  if filename == "README.md":
                      continue

                  try:
                      if os.path.getsize(path) > 100_000:
                          continue

                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()

                      source_files.append(
                          f"\n===== {path} =====\n{content}"
                      )

                  except (UnicodeDecodeError, OSError):
                      continue

          repository = "\n".join(source_files)

          prompt = f"""
          You are an expert software documentation analyst.

          Analyze the source code below.

          Generate the contents of:

          .github/readme-prompt.txt

          This file will be passed to another AI which will generate the
          project's README.md.

          The generated prompt must tell that AI what the README should
          contain based on the ACTUAL functionality of this repository.

          Include relevant information such as:

          - What the project does
          - What problem it solves
          - Main features
          - Installation
          - Setup
          - Usage
          - Commands
          - API endpoints
          - Configuration
          - Environment variables
          - Dependencies
          - Examples
          - Important limitations
          - Project structure
          - License information if present

          IMPORTANT:

          - Do not invent functionality.
          - Do not assume undocumented features exist.
          - Base everything on the supplied source code.
          - Do not write README.md itself.
          - Write instructions for the README-generating AI instead.
          - Return ONLY the contents of readme-prompt.txt.

          SOURCE CODE:

          {repository}
          """

          result = subprocess.run(
              [
                  "gh",
                  "models",
                  "run",
                  "openai/gpt-4.1",
                  "--prompt",
                  prompt
              ],
              env=os.environ,
              capture_output=True,
              text=True
          )

          if result.returncode != 0:
              print("GitHub Models failed:")
              print(result.stderr)
              raise SystemExit(result.returncode)

          output = result.stdout.strip()

          if not output:
              raise RuntimeError(
                  "GitHub Models returned an empty response."
              )

          os.makedirs(".github", exist_ok=True)

          with open(
              ".github/readme-prompt.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(output + "\n")

          print("Successfully generated .github/readme-prompt.txt")
          PY

      - name: Commit generated prompt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/readme-prompt.txt

          if git diff --cached --quiet; then
            echo "No changes to readme-prompt.txt"
            exit 0
          fi

          git commit -m "docs: update README generation prompt"
          git push
```
